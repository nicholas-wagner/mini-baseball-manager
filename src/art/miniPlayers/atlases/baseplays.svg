  <use xlink:href="#poses"/>
  <g transform="translate(0 1536)" filter="url(#mask)" style="--fabric:black;--shade:black;--trim:black;--pad:black;--skin:#eee;--leather:black;--light:black;--ink:black;--thread:black"><use xlink:href="#poses"/></g>
