<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="3072" viewBox="0 0 1024 3072">
  <!-- Four registered poses per uniform row. The lower half is the matching skin ink mask. -->
  <style>
    .uniform{fill:var(--fabric,#f4e8d8)} .shade{fill:var(--shade,#baaaa7)}
    .red{fill:var(--trim,#be3442)} .blue{fill:var(--pad,#303f60)}
    .skin{fill:var(--skin,#eeb481)} .mitt{fill:var(--leather,#b3692c)}
    .light{fill:var(--light,#efae5b)} .seam{fill:none;stroke:var(--ink,#49313a);stroke-width:2}
    .detail{fill:none;stroke:var(--thread,#fff0d6);stroke-width:2.3}
  </style>
  <defs>
