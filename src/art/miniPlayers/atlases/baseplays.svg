    <g id="shortsrow"><use xlink:href="#slidelegs"/><use xlink:href="#slideshorts"/><use xlink:href="#slidetop"/><g transform="translate(256)"><use xlink:href="#stancelegs"/><use xlink:href="#shortlegs"/><use xlink:href="#tagtop"/></g></g>
