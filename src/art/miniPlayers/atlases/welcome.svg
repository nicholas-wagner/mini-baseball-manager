  <path class="red" d="m77 99 20 14-4 7-20-15Zm86-15 5-5 12 20-5 4Z"/>
  <path class="blue" d="M102 151Q125 159 149 150L151 158Q126 168 100 159Z"/>
</g>
<g id="tap">
  <path class="skin" d="M89 93Q73 100 79 124L91 139 98 133 90 118 102 105Z"/>
  <path class="uniform" d="m90 133 7-5 10 10-2 8-7 2-8-7Z"/>
  <path class="skin" d="M156 93Q171 90 180 105L196 113 216 109 218 121 193 127Q183 128 171 120L152 111Z"/>
