  <path class="skin" d="M152 94Q166 93 176 80L190 54 185 28 198 22 206 55Q204 65 198 74L184 100Q174 115 157 113Z"/>
  <path class="red" d="m184 32 15-6 3 9-16 6Z"/>
  <path class="uniform" d="m183 27-2-10-15-4q-6-4-1-7l19 2 5-4 9 4 3 12-4 8-10 4Z"/>
