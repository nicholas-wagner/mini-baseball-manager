</g>
<g id="poses" stroke="var(--ink,#30232c)" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(0 0)"><use xlink:href="#stancelegs"/><use xlink:href="#longlegs"/><use xlink:href="#arms"/></g>
<g transform="translate(0 256)"><use xlink:href="#stancelegs"/><use xlink:href="#shortlegs"/><use xlink:href="#arms"/></g>
<g transform="translate(0 512)"><use xlink:href="#stancelegs"/><use xlink:href="#skirt"/><use xlink:href="#arms"/></g>
